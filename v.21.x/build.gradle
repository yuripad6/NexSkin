plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'com.nexskin'
version = '0.1.2-beta-mc1.21'

repositories {
    mavenCentral()
    maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-public/") }
    maven { url = uri("https://repo.extendedclip.com/content/repositories/placeholderapi/") }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    compileOnly 'fr.xephi:authme:5.7.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.xerial:sqlite-jdbc:3.45.0.0'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName.set('NexSkin')
    archiveVersion.set(version)
    archiveClassifier.set('')

    relocate 'com.google.gson', 'com.nexskin.libs.gson'
    relocate 'org.sqlite', 'com.nexskin.libs.sqlite'
    relocate 'org.bstats', 'com.nexskin.libs.bstats'
}

tasks.build {
    dependsOn(tasks.shadowJar)
}